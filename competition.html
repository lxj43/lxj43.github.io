<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="李学均 - 竞赛获奖与证书展示" />
  <title>竞赛获奖 · 李学均</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>

  <nav class="site-nav" id="site-nav" aria-label="页面导览"></nav>

  <div class="container container--wide">
    <header class="profile page-hero page-hero--compact">
      <img class="avatar-img" src="images/avatar.jpg" alt="李学均证件照" width="120" height="150" />
      <div class="profile-main">
        <h1>竞赛获奖</h1>
        <p class="tagline">在数学建模、算法竞赛、数字经济决策与创新创业赛事中持续积累建模、推演和表达能力。</p>
      </div>
    </header>

    <main>
      <section id="competition" class="competition-section">
        <div class="section-head section-head--split">
          <h2>获奖总览与证书展示</h2>
          <span class="section-note">上方显示奖项介绍，下方证书墙支持滚轮与箭头切换</span>
        </div>
        <p class="section-intro">将鼠标移入下方证书墙区域后，滚动鼠标滚轮即可逐项切换；也可点击证书墙左右两侧的线性箭头切换。未上传图片的奖项会保留证书占位，后续替换同名图片即可。</p>
        <div id="award-carousel-root"></div>
      </section>
    </main>

    <footer>
      <p>© <span id="year"></span> 李学均 · 托管于 <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a></p>
    </footer>
  </div>

  <script src="js/site-nav.js"></script>
  <script src="js/competition-carousel.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
